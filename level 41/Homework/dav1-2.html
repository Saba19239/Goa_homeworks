<!--
1) justify-content - განსაზღვრავს, როგორ განაწილდნენ ელემენტები მთავარ ღერძზე.
   align-items - განსაზღვრავს, როგორ განლაგდნენ ელემენტები გადამკვეთ ღერძზე.
   flex-flow - აერთიანებს flex-direction-სა და flex-wrap-ს.
   flex-wrap - განსაზღვრავს, გადავიდნენ თუ არა ელემენტები ახალ ხაზზე.
   gap - განსაზღვრავს დაშორებას ელემენტებს შორის.

2) space-around - ელემენტების გარშემო თანაბარ სივრცეს ანაწილებს.
   space-between - თავისუფალ სივრცეს მხოლოდ ელემენტებს შორის ანაწილებს.
   space-evenly - ელემენტებს შორის და კიდეებთან თანაბარ დაშორებას ქმნის.
-->
