<!--
1) Flexbox არის CSS-ის განლაგების სისტემა (Layout),
რომელიც გამოიყენება ელემენტების მარტივად და მოქნილად
განლაგებისთვის კონტეინერის შიგნით.
მისი დახმარებით შეგვიძლია ელემენტების გასწორება,
განაწილება და მიმართულების შეცვლა.

2) flex-direction განსაზღვრავს, თუ რა მიმართულებით
განლაგდებიან Flexbox-ის შიგნით არსებული ელემენტები.

row — ელემენტები განლაგდება ჰორიზონტალურად,
მარცხნიდან მარჯვნივ.

column — ელემენტები განლაგდება ვერტიკალურად,
ზემოდან ქვემოთ.

row-reverse — ელემენტები განლაგდება ჰორიზონტალურად,
მაგრამ საპირისპირო მიმართულებით, მარჯვნიდან მარცხნივ.

column-reverse — ელემენტები განლაგდება ვერტიკალურად,
მაგრამ საპირისპირო მიმართულებით, ქვემოდან ზემოთ.

4) CSS Reset არის CSS-ის წესების ნაკრები,
რომელიც აუქმებს ბრაუზერის მიერ ავტომატურად მინიჭებულ
სტანდარტულ სტილებს (მაგალითად, margin-სა და padding-ს).
მას ვიყენებთ იმისთვის, რომ სხვადასხვა ბრაუზერში
ელემენტები ერთნაირად გამოჩნდეს და სტილიზაცია
ნულიდან დავიწყოთ.

5) box-sizing არის CSS თვისება, რომელიც განსაზღვრავს,
როგორ გამოითვლება ელემენტის სიგანე და სიმაღლე.
box-sizing: border-box-ის გამოყენებისას
ელემენტის საერთო ზომაში შედის content, padding და border,
რაც ზომების კონტროლს ამარტივებს.-->
