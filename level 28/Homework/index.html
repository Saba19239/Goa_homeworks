<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 H1 და 5 P</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 class="h1-1">პირველი სათაური</h1>
    <p class="p-1">პირველი პარაგრაფი.</p>

    <h1 class="h1-2">მეორე სათაური</h1>
    <p class="p-2">მეორე პარაგრაფი.</p>

    <h1 class="h1-3">მესამე სათაური</h1>
    <p class="p-3">მესამე პარაგრაფი.</p>

    <h1 class="h1-4">მეოთხე სათაური</h1>
    <p class="p-4">მეოთხე პარაგრაფი.</p>

    <h1 class="h1-5">მეხუთე სათაური</h1>
    <p class="p-5">მეხუთე პარაგრაფი.</p>

</body>
</html>

<!--
3.
 Inline CSS
იწერება პირდაპირ HTML თეგში style ატრიბუტის საშუალებით.
მაგალითად:
<p style="color: red;">ტექსტი</p>

 Internal CSS
იწერება HTML ფაილის <head> ტერიტორიაში <style> თეგის გამოყენებით.   

 External CSS
იწერება ცალკე .css ფაილში და HTML-ს უკავშირდება <link> თეგით.
მაგალითად:
<link rel="stylesheet" href="style.css">
-->
