<html>
<head>
    <title>ფორმები</title>
</head>
<body>

    <h1>სარეგისტრაციო ფორმა</h1>

    <form>

        <label for="fullname">სრული სახელი:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter First Name" required>
        <br><br>

        <label for="email">ელფოსტა:</label>
        <input type="text" id="email" name="email" placeholder="Enter Last Name" required>
        <br><br>

        <label for="password">პაროლი:</label>
        <input type="text" id="password" name="password" placeholder="Enter Email Address" required>
        <br><br>

        <input type="submit" value="რეგისტრაცია">
        <br>
        <br>

        <label for="number">Number:</label>
        <input type="number" id="number">
        <br><br>

        <label for="color">Color:</label>
        <input type="color" id="color">
        <br><br>
 
        <label for="week">Week:</label>
        <input type="week" id="week">
        <br><br>

    <label for="range">Range:</label>
    <input type="range" id="range">
    </form>
   

</body>
</html>
