<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ჩემი სპორტი</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }

        #title {
            color: darkblue;
            text-align: center;
        }

        .text {
            color: darkgreen;
            font-size: 18px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1 id="title">ჩემი საყვარელი სპორტი ⚽</h1>

    <div class="box">
        <h2>ფეხბურთი</h2>

        <p class="text">
            ფეხბურთი არის სპორტი, რომელსაც მთელ მსოფლიოში უამრავი ადამიანი
            უყურებს და თამაშობს.
        </p>

        <p class="text">
            ჩემი საყვარელი ნაწილია გუნდების ერთმანეთთან შეჯიბრი.
        </p>

        <button>გაიგე მეტი</button>
    </div>

</body>
</html>
