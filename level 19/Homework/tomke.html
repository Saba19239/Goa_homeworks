<html>
<head>
    <title>Application Form</title>
</head>
<body>

    <h1>APPLICATION FORM</h1>
    
    <p>
        Thank you for your interest in working with us. Please check below for available job opportunities that meet your criteria and send your application by filling out the Job Application Form.
    </p>

    <form>
        
        <label>* Full Name:</label><br>
        <input type="text" placeholder="Enter your full name" required>
        <br><br>

        <label>* Email:</label><br>
        <input type="email" placeholder="Enter your Email" required>
        <br><br>

        <label>* Age:</label><br>
        <input type="number" placeholder="Age" required>
        <br><br>

        <label>Which option best describes your current role?</label><br>
        <select>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="developer">Developer</option>
        </select>
        <br><br>

        <label>* Would you like to list references?</label><br>
        Yes <input type="radio" name="ref" value="yes" required><br>
        No <input type="radio" name="ref" value="no">
        <br><br>

        <label>Which position would you like to apply for?</label><br>
        <select>
            <option value="">Select an option</option>
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
        </select>
        <br><br>

        <label>Which programming languages do you know?</label><br>
        <input type="checkbox" name="lang" value="java"> Java<br>
        <input type="checkbox" name="lang" value="python"> Python<br>
        <input type="checkbox" name="lang" value="javascript"> JavaScript<br>
        <input type="checkbox" name="lang" value="cpp"> C++<br>
        <input type="checkbox" name="lang" value="swift"> Swift<br>
        <input type="checkbox" name="lang" value="ruby"> Ruby<br>
        <input type="checkbox" name="lang" value="net"> .NET
        <br><br>

        <label>Any Comments?</label><br>
        <textarea placeholder="Enter your comment here..."></textarea>

    </form>

</body>
</html>
