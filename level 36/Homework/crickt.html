<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Table</title>
    <link rel="stylesheet" href="crickt.css">
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Firstname</th>
                <th>Lastname</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td class="gold">Bahadur</td>
                <td class="green-gray">Lodhi</td>
                <td class="green-gray">20</td>
            </tr>

            <tr>
                <td class="blue">Shubham</td>
                <td class="purple">Ji</td>
                <td class="yellow">25</td>
            </tr>

            <tr>
                <td class="yellow">Michael</td>
                <td class="red">John</td>
                <td class="green">40</td>
            </tr>

            <tr>
                <td class="purple">Aman</td>
                <td class="blue">Sign</td>
                <td class="gray-purple">20</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
