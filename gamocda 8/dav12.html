<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="5h1.css">
    <style>
        h1:nth-child(1) {
            color: rgb(255, 0, 0);
        }

        h1:nth-child(2) {
            color: rgb(0, 128, 0);
        }

        h1:nth-child(3) {
            color: rgb(0, 0, 255);
        }

        h1:nth-child(4) {
            color: rgb(255, 165, 0);
        }

         h1:nth-child(5) {
            color: rgb(128, 0, 128);
        }
    </style>
</head>
<body>
    <h1>red</h1>
    <h1>green</h1>
    <h1>blue</h1>
    <h1>orange</h1>
    <h1>purple</h1>
</body>
</html>
