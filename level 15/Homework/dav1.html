<!--
ატრიბუტები გამოიყენება HTML ფოტოებისთვის დამატებითი ინფორმაციის მისაცემად.

1) href 
დანიშნულება ლინკის მისამართის მითითება
გამოიყენება <a> თეგში
ტიპი Required 


2) src 
დანიშნულება სურათის წყაროს მითითება
გამოიყენება <img>
ტიპი Required


3) alt 
დანიშნულება სურათის აღწერა თუ სურათი ვერ ჩაიტვირთა, ის ასევე screen reader-ებისთვისაც გამოიყენება
გამოიყენება <img>
ტიპი: Optional (არასავალდებულო, მაგრამ კარგი პრაქტიკაა)


4) width 
დანიშნულებას ფოტოს სიგანის განსაზღვრა
გამოიყენება <img>
ტიპი Optional


5) height 
დანიშნულება ფოტოს სიმაღლის განსაზღვრა
გამოიყენება: <img>
ტიპი Optional


6) id ატრიბუტი
დანიშნულებაა ელემენტისთვის უნიკალური სახელის მინიჭება, და მომხმარებლის იმავე სახელის მქონე სექციაში ან ფაილში გადაყვანა
გამოიყენება ნავიგაციაში
-->
